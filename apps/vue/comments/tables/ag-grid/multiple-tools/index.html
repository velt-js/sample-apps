<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/function.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velt AG Grid Multiple Tools Demo</title>
    <script>
      (function() {
        try {
          var p = new URLSearchParams(window.location.search);
          var theme = p.get('theme') || localStorage.getItem('theme-preference');
          var isDark = theme === 'dark' || (!theme && false) || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600&family=DM+Mono:wght@400&family=Inter:wght@400&family=Poppins:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
